[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
gpui = "=0.2.2"
cpal = "0.18"
rtrb = "0.4"
basedrop = "0.1"
assert_no_alloc = "1.1"
symphonia = "0.6"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
notify = "8"
nucleo-matcher = "0.3"
thiserror = "2"
dirs = "6"
